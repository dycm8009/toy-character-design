version: "2.1"
purpose: >-
  Structured design state for toy-character-design, not a user questionnaire.
  Infer fields where possible. Compile only current requirements and necessary
  references into an isolated visual task; never send this entire state as a prompt.

brief:
  ip_mode: original            # original | licensed | co-created
  rights_status: owned         # owned | licensed | concept-only | unknown
  target_audience: null
  usage_scene: []              # desk | bag | shelf | unboxing | wearable | gift | other
  target_srp: null
  product_scope: concept       # concept | prototype | production
  user_hard_requirements: []   # id, text, source_turn; higher priority than presets
  approval_checkpoints: []

ip_core:
  emotion_core: null
  character_desire: null
  character_paradox: null
  world_rule: null
  recurring_motifs: []

visual_dna:
  silhouette_signature: []     # recommend 2-4; not a quota overriding user intent
  recognition_tokens: []       # recommend 1-3
  proportion_archetype: custom # soft-round | compact | lanky | top-heavy | creature | irregular | custom
  head_height_ratio: null
  body_mass_profile: custom    # bean | pear | wedge | column | long-leg | top-heavy | irregular | custom
  face_grammar:
    information_density: medium
    visual_focus: eyes
    eye_rule: null
    mouth_rule: null
    nose_rule: null
    negative_space_rule: null
    expression_range: null
  asymmetry_degree: 0
  personality_axes:
    cute: 0
    weird: 0
    rebellious: 0
    melancholy: 0
    fashion: 0
  identity_material_cues: []

locks:
  identity_locked: []
  series_locked: []
  variant_flexible: []
  approved_revision: null
  approval_ref: null

series:
  transformation_rule: null
  invariants: []
  size: null
  variant_delta_budget:
    identity: 70
    theme: 20
    surprise: 10
  rarity_tiers: null
  secret_upgrade: []
  variants: []

variant_template:
  variant_id: null
  narrative_beat: null
  identity_invariants: []
  series_rule_application: null
  expression: null
  pose: null
  material_delta: null
  outfit_or_surface: null
  prop:
    description: null
    function: null
  surprise: null

palette:
  roles:
    base: []
    secondary: []
    accent: []
    neutral: []
  notes: null

materials:
  material_map: {}
  finish_stack: []
  optical_effects: []
  tactile_contrast: null
  soft_hard_interface: null

product:
  form: null
  interaction_mode: []
  removable_parts: []
  hero_shot_hook: null
  unboxing_reveal: null
  ugc_action: null

production_optional:
  manufacturing_route: null
  part_count_budget: null
  paint_mask_budget: null
  seam_plan: null
  mold_split_strategy: null
  center_of_gravity_note: null
  hanging_point: null
  supplier_min_feature_mm: null # supplier input; do not invent
  supplier_min_wall_mm: null    # supplier input; do not invent
  assembly_tolerance_mm: null   # supplier input; do not invent
  compliance_targets: []

collaboration_optional:
  collab_invariants: []
  collab_transform_rule: null
  approval_gate: null

execution:
  protocol_version: "1.0"
  capability_status: pending   # verified | blocked_capability | pending; never assume
  host_runtime: null
  isolation_evidence: []
  plan_schema: image-execution-plan.schema.json
  plan_path: null
  ledger_path: null
  max_image_calls_per_task: 3  # initial + corrections; one shared persistent budget
  independent_review_required: true
  actual_image_binding_required: true
  route_batch_review: pending
  reference_registry: []       # id, role, path, sha256, source_task, source_revision
  output_registry: []          # immutable paths, hashes, QC and approval state
  stale_dependencies: []
  user_authorized_revisions: []
  legacy_migration: >-
    Preserve previous design approvals; missing runtime evidence stays unverified.
    Never fabricate receipts or retrospective successful QC for older images.

qc:
  silhouette_test: pending
  thumbnail_test: pending
  outfit_removal_test: pending
  reference_distance_test: pending
  visual_consistency: pending
  market_readiness_score: null
  user_requirement_checks: []
  unresolved_risks: []
  real_isolated_image_validation: pending
